spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ng_fields_test}?currentSchema=reports&sslmode=disable
  flyway:
    enabled: true
    schemas: reports
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8088/realms/ng-fields

intervention-service:
  url: http://localhost:8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    env:
      enabled: false

logging:
  level:
    tg.ngstars.report: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
